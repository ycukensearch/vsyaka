<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стрелялка</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <h1>Стрелялка</h1>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Размер холста
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Игрок
    const player = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 60,
      w: 50,
      h: 40,
      speed: 7,
      dx: 0
    };

    // Пули
    const bullets = [];
    function shoot() {
      bullets.push({
        x: player.x + player.w / 2 - 4,
        y: player.y,
        w: 8,
        h: 16,
        speed: 10
      });
    }

    // Враги
    const enemies = [];
    let spawnTimer = 0;

    // Управление
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') player.dx = -player.speed;
      if (e.key === 'ArrowRight' || e.key === 'd') player.dx = player.speed;
      if (e.key === ' ' || e.key === 'Space') shoot();
    });

    window.addEventListener('keyup', e => {
      if (
        e.key === 'ArrowLeft' || e.key === 'a' ||
        e.key === 'ArrowRight' || e.key === 'd'
      ) player.dx = 0;
    });

    // Игровой цикл
    function update() {
      // Движение игрока
      player.x += player.dx;
      if (player.x < 0) player.x = 0;
      if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

      // Пули вверх
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -bullets[i].h) bullets.splice(i, 1);
      }

      // Спавн врагов
      spawnTimer++;
      if (spawnTimer % 60 === 0) { // каждые ~60 кадров (≈1 сек при 60 FPS)
        enemies.push({
          x: Math.random() * (canvas.width - 40),
          y: -40,
          w: 40,
          h: 40,
          speed: 3 + Math.random() * 2
        });
      }

      // Враги вниз
      for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].y += enemies[i].speed;
        // Столкновение с пулями
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const e = enemies[i];
          if (
            b.x < e.x + e.w &&
            b.x + b.w > e.x &&
            b.y < e.y + e.h &&
            b.y + b.h > e.y
          ) {
            bullets.splice(j, 1);
            enemies.splice(i, 1);
            break;
          }
        }
        // Если враг ушёл за низ — удаляем
        if (enemies[i].y > canvas.height) enemies.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Игрок
      ctx.fillStyle = 'Red';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Пули
      ctx.fillStyle = '#f80';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Враги
      ctx.fillStyle = 'Blue';
      enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();

    // Адаптация при изменении размера окна
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
